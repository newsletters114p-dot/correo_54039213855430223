name: Gestionar ticker

on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'Acción a realizar'
        required: true
        type: choice
        options:
          - añadir
          - eliminar
      ticker:
        description: 'Ticker (ej: NEE US)'
        required: true
        type: string
      nombre:
        description: 'Nombre de la empresa (ej: NextEra Energy Inc)'
        required: false
        type: string
      sector:
        description: 'Sector'
        required: false
        type: choice
        options:
          - Information Technology
          - Communication Services
          - Health Care
          - Industrials
          - Financials
          - Real Estate
          - Consumer Staples
          - Consumer Discretionary
          - Energy
          - Utilities
          - Materials
          - Hall of Fame
      tipo:
        description: 'Tipo'
        required: false
        type: choice
        options:
          - Titular
          - Banquillo
          - Cantera
          - Hall of Fame

permissions:
  contents: write

jobs:
  gestionar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install yfinance

      - name: Restaurar DB desde cache
        uses: actions/cache@v4
        with:
          path: data/graficos.db
          key: graficos-db-v1
          restore-keys: |
            graficos-db-v1

      - name: Ejecutar gestionar_ticker.py
        env:
          ACCION:  ${{ github.event.inputs.accion }}
          TICKER:  ${{ github.event.inputs.ticker }}
          NOMBRE:  ${{ github.event.inputs.nombre }}
          SECTOR:  ${{ github.event.inputs.sector }}
          TIPO:    ${{ github.event.inputs.tipo }}
        run: python gestionar_ticker.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tickers_activos.csv docs/index.html data/graficos.db || true
          if ! git diff --staged --quiet; then
            git commit -m "🔧 ${{ github.event.inputs.accion }}: ${{ github.event.inputs.ticker }}"
            git pull --rebase
            git push
          else
            echo "Sin cambios que commitear"
          fi
