name: Gestionar ticker

on:
  workflow_dispatch:
    inputs:
      accion_1:
        description: 'Operación 1'
        required: true
        type: choice
        options:
          - ninguna
          - añadir
          - eliminar
      ticker_1:
        description: 'Ticker 1 (ej: NEE US)'
        required: false
        type: string
      nombre_1:
        description: 'Nombre 1 (solo si añadir)'
        required: false
        type: string
      sector_1:
        description: 'Sector 1 (solo si añadir)'
        required: false
        type: choice
        options:
          - '-'
          - Information Technology
          - Communication Services
          - Health Care
          - Industrials
          - Financials
          - Real Estate
          - Consumer Staples
          - Consumer Discretionary
          - Energy
          - Utilities
          - Materials
          - Hall of Fame
      tipo_1:
        description: 'Tipo 1 (solo si añadir)'
        required: false
        type: choice
        options:
          - '-'
          - Titular
          - Banquillo
          - Cantera
          - Hall of Fame
      accion_2:
        description: 'Operación 2'
        required: true
        type: choice
        options:
          - ninguna
          - añadir
          - eliminar
      ticker_2:
        description: 'Ticker 2 (ej: WEC US)'
        required: false
        type: string
      nombre_2:
        description: 'Nombre 2 (solo si añadir)'
        required: false
        type: string
      sector_2:
        description: 'Sector 2 (solo si añadir)'
        required: false
        type: choice
        options:
          - '-'
          - Information Technology
          - Communication Services
          - Health Care
          - Industrials
          - Financials
          - Real Estate
          - Consumer Staples
          - Consumer Discretionary
          - Energy
          - Utilities
          - Materials
          - Hall of Fame
      tipo_2:
        description: 'Tipo 2 (solo si añadir)'
        required: false
        type: choice
        options:
          - '-'
          - Titular
          - Banquillo
          - Cantera
          - Hall of Fame

permissions:
  contents: write

jobs:
  gestionar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install yfinance

      - name: Restaurar DB desde cache
        uses: actions/cache@v4
        with:
          path: data/graficos.db
          key: graficos-db-${{ github.run_id }}
          restore-keys: |
            graficos-db-

      - name: Ejecutar gestionar_ticker.py
        env:
          ACCION_1:  ${{ github.event.inputs.accion_1 }}
          TICKER_1:  ${{ github.event.inputs.ticker_1 }}
          NOMBRE_1:  ${{ github.event.inputs.nombre_1 }}
          SECTOR_1:  ${{ github.event.inputs.sector_1 }}
          TIPO_1:    ${{ github.event.inputs.tipo_1 }}
          ACCION_2:  ${{ github.event.inputs.accion_2 }}
          TICKER_2:  ${{ github.event.inputs.ticker_2 }}
          NOMBRE_2:  ${{ github.event.inputs.nombre_2 }}
          SECTOR_2:  ${{ github.event.inputs.sector_2 }}
          TIPO_2:    ${{ github.event.inputs.tipo_2 }}
        run: python gestionar_ticker.py

      - name: Guardar DB en cache
        uses: actions/cache/save@v4
        with:
          path: data/graficos.db
          key: graficos-db-${{ github.run_id }}

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tickers_activos.csv tickers_maestro.csv docs/index.html preview.html REPOSITORIO_GRAFICOS/ || true
          if ! git diff --staged --quiet; then
            git commit -m "🔧 Gestionar: ${{ github.event.inputs.ticker_1 }} ${{ github.event.inputs.ticker_2 }}"
            git pull --rebase
            git push
          else
            echo "Sin cambios que commitear"
          fi